name: 'Terraform CI/CD'
on:
  push:
    branches:
      - main
      - dev/cicd_pipeline
env:
  TF_VERSION: '1.15.4'
  AWS_REGION: 'us-east-1'
jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      server_ip: ${{ steps.get_ip.outputs.server_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          terraform plan -no-color -input=false \
            -var="minecraft_username=${{ secrets.MINECRAFT_USERNAME }}"
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -auto-approve -input=false \
            -var="minecraft_username=${{ secrets.MINECRAFT_USERNAME }}"

      - name: Wait for ECS Task to Start
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: sleep 30

      - name: Get Minecraft Server IP
        id: get_ip
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLUSTER_NAME: "minecraft-servers"
          SERVICE_NAME: "minecraft-vanilla"
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster $CLUSTER_NAME \
            --service-name $SERVICE_NAME \
            --query 'taskArns[0]' \
            --output text)

          ENI_ID=$(aws ecs describe-tasks \
            --cluster $CLUSTER_NAME \
            --tasks $TASK_ARN \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
            --output text)

          SERVER_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids $ENI_ID \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT
          echo "Minecraft Server IP: \`$SERVER_IP\`" >> $GITHUB_STEP_SUMMARY

  print_server_ip:
    name: 'Print Server IP'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Display Server IP
        run: |
          echo "Minecraft server is live at: ${{ needs.terraform.outputs.server_ip }}"