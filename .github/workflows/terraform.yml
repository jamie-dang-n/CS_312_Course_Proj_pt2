name: 'Terraform CI/CD'
on:
  push:
    branches:
      - main
env:
  TF_VERSION: '1.15.4'
  AWS_REGION: ${{ secrets.AWS_REGION }}
  BUCKET_NAME: ${{ secrets.TF_STATE_BUCKET_NAME }}
jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      server_ip: ${{ steps.get_ip.outputs.server_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Terraform State Bucket
        run: |
          if ! aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null; then
            aws s3api create-bucket \
              --bucket $BUCKET_NAME \
              --region ${{ env.AWS_REGION }}
            echo "Bucket created: $BUCKET_NAME"
          else
            echo "Bucket already exists, continuing..."
          fi

      # Pass bucket name at init time
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_NAME" \
            -backend-config="key=minecraft/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'push'
        run: |
          terraform plan -no-color -input=false \
            -var="minecraft_username=${{ secrets.MINECRAFT_USERNAME }}"
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -auto-approve -input=false \
            -var="minecraft_username=${{ secrets.MINECRAFT_USERNAME }}"

      - name: Get Minecraft Server IP
        id: get_ip
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLUSTER_NAME: "minecraft-servers"
          SERVICE_NAME: "minecraft-vanilla"
        run: |
          for i in $(seq 1 20); do
            TASK_ARN=$(aws ecs list-tasks \
              --cluster $CLUSTER_NAME \
              --service-name $SERVICE_NAME \
              --desired-status RUNNING \
              --query 'taskArns[0]' \
              --output text)
            echo "Attempt $i/20 - Task ARN: $TASK_ARN"

            if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
              ENI_ID=$(aws ecs describe-tasks \
                --cluster $CLUSTER_NAME \
                --tasks $TASK_ARN \
                --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
                --output text)
              echo "ENI ID: $ENI_ID"

              if [ "$ENI_ID" != "None" ] && [ -n "$ENI_ID" ]; then
                SERVER_IP=$(aws ec2 describe-network-interfaces \
                  --network-interface-ids $ENI_ID \
                  --query 'NetworkInterfaces[0].Association.PublicIp' \
                  --output text)
                echo "Server IP: $SERVER_IP"

                if [ "$SERVER_IP" != "None" ] && [ -n "$SERVER_IP" ]; then
                  echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT
                  echo "Minecraft Server IP: \`$SERVER_IP\`" >> $GITHUB_STEP_SUMMARY
                  exit 0
                fi
              fi
            fi

            echo "Not ready yet, waiting 15 seconds..."
            sleep 15
          done
          echo "Timed out waiting for server IP"
          exit 1

  print_server_ip:
    name: 'Print Server IP'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Display Server IP
        run: |
          echo "Minecraft server is live at: ${{ needs.terraform.outputs.server_ip }}"